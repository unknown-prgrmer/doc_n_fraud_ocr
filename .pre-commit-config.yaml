repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: run-lint-module
        name: Run lint_module.sh
        entry: bash lint_module.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: run-tests
        name: Run run_tests.sh
        entry: bash run_tests.sh
        language: system
        pass_filenames: false
        always_run: true
