services:
  web:
    build: .
    ports:
      - "8080:9000"
    platform: "linux/amd64"
    environment:
      APP_DEPENDENCY_MODE: production
      MONGODB_URI: mongodb://mongo:27017/
      MONGODB_DATABASE: ocr_pipeline
      MONGODB_COLLECTION: predictions
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ocr-images
      MINIO_SECURE: "false"
    depends_on:
      - mongo
      - minio

  grafana:
    image: grafana/grafana:12.0.2
    ports:
      - 3000:3000
    volumes:
      - "./provisioning/grafana/datasources:/etc/grafana/provisioning/datasources"
      - "./provisioning/grafana/dashboards:/etc/grafana/provisioning/dashboards"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.53.5
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
      - "./provisioning/prometheus:/etc/prometheus/rules"
    ports:
      - 9090:9090
  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
      - "443:443"
    entrypoint:
      - minio
      - server
      - /data
      - --console-address
      - ":9001"
  mongo:
        image: "mongo:8.0.11"
        container_name: mongo
        ports:
          - "27017:27017"
# Conteneur contenant des exemples de monitoring.
  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "9004:8080"
    volumes:
      - "/:/rootfs"
      - "/var/run:/var/run"
      - "/sys:/sys"
      - "/var/lib/docker/:/var/lib/docker"
      - "/dev/disk/:/dev/disk"
    privileged: true
    devices:
      - "/dev/kmsg"
